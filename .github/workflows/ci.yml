name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck 0.11.0 (pinned; older versions report different notes)
        run: |
          curl -fsSL https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz | tar -xJ
          sudo install shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck
          shellcheck --version
      - name: Git identity for the scaffold test
        run: git config --global user.name "CI" && git config --global user.email ci@example.com
      - name: Self-test (scaffold, php -l, shellcheck, JSON/XML, manifest, starter rules)
        run: bash tests/selftest.sh

  phpcs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Scaffold a sample site
        run: bin/wp-site-new --name "Acme Tours" --slug acme-tours --prefix acme --domain example.com --dir "$RUNNER_TEMP/acme-tours"
      - name: PHPCS (WordPress Coding Standards + PHPCompatibilityWP)
        working-directory: ${{ runner.temp }}/acme-tours
        run: |
          composer install --no-interaction --no-progress
          vendor/bin/phpcs

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
